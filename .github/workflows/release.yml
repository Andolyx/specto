name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    outputs:
      created: ${{ steps.release.outputs.release_created }}
      pr: ${{ steps.release.outputs.pr }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - id: release
        name: Release
        uses: googleapis/release-please-action@v4

  # Releases are hands-free: fix upstream references in the release PR, merge it, and run this
  # workflow again so release-please tags the release. Merges made with GITHUB_TOKEN don't
  # trigger workflows on their own.
  publish:
    name: Publish
    runs-on: ubuntu-latest

    needs:
      - release-please

    if: needs.release-please.outputs.prs_created == 'true'

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ fromJSON(needs.release-please.outputs.pr).number }}
      UPSTREAM_REPOSITORY: Seldszar/Gumbo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          fetch-depth: 0

      - name: Fix Upstream References
        run: |
          git remote add upstream "https://github.com/$UPSTREAM_REPOSITORY.git"
          git fetch --quiet upstream main

          gh pr view "$PR_NUMBER" --json body --jq .body > body.md
          python3 .github/scripts/link-upstream-refs.py CHANGELOG.md body.md
          gh pr edit "$PR_NUMBER" --body-file body.md

          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "chore: link upstream references in changelog" CHANGELOG.md
            git push
          fi

      - name: Merge
        run: |
          gh pr merge "$PR_NUMBER" --merge
          gh workflow run release.yml --ref main

  submit:
    name: Submit
    runs-on: ubuntu-latest

    needs:
      - release-please

    if: needs.release-please.outputs.created

    env:
      CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
      WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - chrome
          - firefox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: yarn install

      - name: Build
        run: yarn build:${{ matrix.platform }}

      - name: Update Manifest
        run: npx dot-json@1 dist/manifest.json version ${{ needs.release-please.outputs.version }}

      - name: Upload Release Artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_NAME: Specto-${{ matrix.platform }}-${{ needs.release-please.outputs.version }}.zip
        run: cd dist && zip -r $ARCHIVE_NAME . && gh release upload ${{ needs.release-please.outputs.tag_name }} $ARCHIVE_NAME

      # Skipped until the store credentials are added as repository secrets.
      - name: Submit
        if: (matrix.platform == 'chrome' && env.EXTENSION_ID != '') || (matrix.platform == 'firefox' && env.WEB_EXT_API_KEY != '')
        run: |
          case ${{ matrix.platform }} in
            chrome)
              cd dist && npx chrome-webstore-upload-cli@2 upload --auto-publish
              ;;
            firefox)
              cd dist && npx web-ext-submit@6
              ;;
          esac
