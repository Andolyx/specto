name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - id: release
        name: Release
        uses: googleapis/release-please-action@v4

  # Releases are hands-free: tidy the changelog in the open release PR, merge it, and run
  # this workflow again so release-please tags the release. Merges made with GITHUB_TOKEN don't
  # trigger workflows on their own. The PR is looked up rather than taken from release-please's
  # outputs, so a release PR left open by an earlier run is picked up too.
  publish:
    name: Publish
    runs-on: ubuntu-latest

    needs:
      - release-please

    if: needs.release-please.outputs.created != 'true'

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_BRANCH: release-please--branches--main
      UPSTREAM_REPOSITORY: Seldszar/Gumbo

    steps:
      - name: Find Release PR
        id: pr
        run: |
          number=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&head=${GITHUB_REPOSITORY_OWNER}:$RELEASE_BRANCH" --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Tidy Changelog
        if: steps.pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          git remote add upstream "https://github.com/$UPSTREAM_REPOSITORY.git"
          git fetch --quiet upstream main

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .body > body.md
          python3 .github/scripts/tidy-changelog.py CHANGELOG.md body.md
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" -F body=@body.md > /dev/null

          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "chore: tidy changelog" CHANGELOG.md
            git push
          fi

      - name: Merge
        if: steps.pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" -f merge_method=merge > /dev/null
          gh workflow run release.yml --ref main --repo "$GITHUB_REPOSITORY"

  submit:
    name: Submit
    runs-on: ubuntu-latest

    needs:
      - release-please

    if: needs.release-please.outputs.created

    env:
      CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
      WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - chrome
          - firefox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: yarn install

      - name: Build
        run: yarn build:${{ matrix.platform }}

      - name: Update Manifest
        run: npx dot-json@1 dist/manifest.json version ${{ needs.release-please.outputs.version }}

      - name: Upload Release Artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_NAME: Specto-${{ matrix.platform }}-${{ needs.release-please.outputs.version }}.zip
        run: cd dist && zip -r $ARCHIVE_NAME . && gh release upload ${{ needs.release-please.outputs.tag_name }} $ARCHIVE_NAME

      # Skipped until the store credentials are added as repository secrets.
      - name: Submit
        if: (matrix.platform == 'chrome' && env.EXTENSION_ID != '') || (matrix.platform == 'firefox' && env.WEB_EXT_API_KEY != '')
        run: |
          case ${{ matrix.platform }} in
            chrome)
              cd dist && npx chrome-webstore-upload-cli@2 upload --auto-publish
              ;;
            firefox)
              cd dist && npx web-ext-submit@6
              ;;
          esac
