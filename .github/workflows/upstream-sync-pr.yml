name: Upstream Sync PR

on:
  push:
    branches:
      - claude/upstream-sync-*

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Open and Merge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The weekly routine can push branches but can't call the GitHub API, so the PR is
      # opened here from the sync merge commit: its subject is the title, its body the report.
      - name: Open PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          commit=$(git log --merges -1 --format=%H "origin/main..HEAD")

          if [ -z "$commit" ]; then
            commit=$(git rev-parse HEAD)
          fi

          git log -1 --format=%b "$commit" > body.md

          draft=false

          if grep -qi '^Draft: yes' body.md; then
            draft=true
          fi

          echo "draft=$draft" >> "$GITHUB_OUTPUT"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "A PR is already open for $BRANCH."
            exit 0
          fi

          args=(--base main --head "$BRANCH" --title "$(git log -1 --format=%s "$commit")" --body-file body.md)

          if [ "$draft" = true ]; then
            args+=(--draft)
          fi

          gh pr create "${args[@]}"

      - name: Install
        if: steps.pr.outputs.draft == 'false'
        run: yarn install --frozen-lockfile

      - name: Test
        if: steps.pr.outputs.draft == 'false'
        run: yarn test && yarn build:chrome && yarn build:firefox

      # Merges made with GITHUB_TOKEN don't trigger workflows, so the release is started explicitly.
      - name: Merge
        if: steps.pr.outputs.draft == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          gh pr merge "$BRANCH" --merge --delete-branch
          gh workflow run release.yml --ref main --repo "$GITHUB_REPOSITORY"
